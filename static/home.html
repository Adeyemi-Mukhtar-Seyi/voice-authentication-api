<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Auth - Home</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="text-center mb-4">
      <h1 class="display-5">🎤 Voice Authentication Dashboard</h1>
      <p class="lead text-muted">Welcome to your secure voice-based login system.</p>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title">Login Result</h4>
        <hr>
        <p><strong>Username:</strong> <span id="username" class="text-primary">-</span></p>
        <p><strong>Predicted User:</strong> <span id="predicted_user" class="text-success">-</span></p>
        <p><strong>Confidence:</strong> <span id="confidence" class="text-warning">-</span></p>
      </div>
    </div>

    <div class="text-center mt-5">
      <a href="/" class="btn btn-outline-secondary">⬅ Back to Login</a>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script to parse query parameters -->
  <script>
    const params = new URLSearchParams(window.location.search);
    const username = params.get("user");
    const predicted = params.get("predicted");
    const confidence = params.get("confidence");

    if (username && predicted && confidence) {
      document.getElementById("username").textContent = username;
      document.getElementById("predicted_user").textContent = predicted;
      document.getElementById("confidence").textContent = `${(parseFloat(confidence) * 100).toFixed(2)}%`;
    } else {
      document.querySelector(".card-body").innerHTML = `
        <div class="alert alert-danger" role="alert">
          ❌ No login result found. Please authenticate again.
        </div>
      `;
    }
  </script>

</body>
</html>
